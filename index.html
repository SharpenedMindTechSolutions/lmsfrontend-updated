<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Title -->
    <title>SharpenedMind LMS | AI-Powered Learning & Skill Development Platform</title>

    <!-- Meta Description (HIGH IMPACT) -->
    <meta
      name="description"
      content="SharpenedMind LMS is an AI-powered learning platform offering structured roadmaps, courses, internships, and career-focused training programs to build real-world skills."
    />

    <!-- Keywords -->
    <meta
      name="keywords"
      content="SharpenedMind LMS, learning management system, skill development platform, online courses, internships, AI learning, roadmap learning, career training"
    />

    <!-- Author -->
    <meta name="author" content="Sharpened Mind Tech & Solutions Pvt Ltd" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://sharpenedmindtechnologies.com/" />

    <!-- Open Graph (Social SEO) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SharpenedMind LMS - AI Learning Platform" />
    <meta
      property="og:description"
      content="Learn smarter with AI-powered roadmaps, real-time tracking, and career-focused courses."
    />
    <meta property="og:image" content="/preview.png" />
    <meta property="og:url" content="https://sharpenedmindtechnologies.com/" />

    <!-- Twitter SEO -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SharpenedMind LMS" />
    <meta
      name="twitter:description"
      content="Upgrade your career with structured learning paths and AI-driven tools."
    />
    <meta name="twitter:image" content="/preview.png" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Theme -->
    <meta name="theme-color" content="#0f172a" />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this LMS platform.</noscript>

    <div id="root"></div>

    <!-- Razorpay Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Main Script -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
